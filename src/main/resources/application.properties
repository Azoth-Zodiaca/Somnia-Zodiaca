spring.application.name=somniazodiaca

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/somniazodiaca?useSSL=false&serverTimezone=UTC

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#con none non fa nulla in automatico per le ddl
#create -> crea e distrugge ogni volta
#update -> aggiorna lo schema se necessario oppure se non c'è lo crea 
#validate -> controlla la struttura del db 
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

#mostra i parametri bindati (es. valori di ? nei PreparedStatement)
#esempio:TRACE  org.hibernate.orm.jdbc.bind.BasicBinder - binding parameter [1] as [VARCHAR] - [Mario]
logging.level.org.hibernate.orm.jdbc.bind=trace

#mostra i dettagli delle richieste di autenticazione
logging.level.org.springframework.security=DEBUG


# application.properties
logging.level.org.springframework.security.web.savedrequest=OFF

# forza springboot ad utilizzre i colori ANSI, facilitando la leggibilità del log
spring.output.ansi.enabled=ALWAYS


#immagini profilo
app.upload-dir=${APP_UPLOAD_DIR:uploads/profiles}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# riduzione del rumore nei logger
# logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
# logging.level.org.hibernate.orm.jdbc.bind=ERROR

# logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=WARN
logging.level.org.springframework.context=ERROR
logging.level.org.springframework.beans=ERROR

spring.config.import=optional:classpath:app-domain.properties,optional:file:.env[.properties]

gemini.api-key=${GEMINI_API_KEY}

geonames.username=${GEONAMES_USERNAME}
#java che pensa che geonames.base-url=https://api.geonames.org abbia certificato di sicurezza scaduto
geonames.base-url=https://secure.geonames.org

astroway.base-url=https://api.astroway.info
astroway.api-key=${ASTROWAY_API_KEY}