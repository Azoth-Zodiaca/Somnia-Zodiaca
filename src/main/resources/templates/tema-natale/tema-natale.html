<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/app-layout :: head('Tema Natale', @{/css/dashboard-style.css})}"></head>

<body>

    <div id="app-root" class="app">

        <!-- SIDEBAR -->
        <div th:replace="~{fragments/app-layout :: sidebar}"></div>

        <!-- MAIN AREA -->
        <div class="app-main">

            <!-- TOPBAR -->
            <header class="topbar">
                <button class="lg-only"></button>
                <h1>Tema Natale</h1>
            </header>

            <!-- PAGE CONTENT -->
            <section class="app-content">

                <div class="surface p-6 accent-border">
                    <h2 class="font-display text-3xl mb-2">Tema Natale</h2>

                    <p class="text-muted text-sm max-w-prose">
                        Il cielo non è mai lo stesso due volte. Inserisci i tuoi dati e rivela la sua trama al momento
                        della tua nascita.
                    </p>

                    <form th:action="@{/tema-natale}" th:object="${input}" method="post"
                        class="mt-6 grid gap-4 max-w-md">

                        <label class="grid gap-1">
                            <span class="text-sm text-muted">Luogo di nascita</span>
                            <input type="text" th:field="*{luogoNascita}" class="input" required>
                        </label>

                        <label class="grid gap-1">
                            <span class="text-sm text-muted">Data di nascita</span>
                            <input type="date" th:field="*{dataNascita}" class="input" required>
                        </label>

                        <label class="grid gap-1">
                            <span class="text-sm text-muted">Ora di nascita</span>
                            <input type="time" th:field="*{oraNascita}" class="input" required>
                        </label>

                        <button type="submit" class="btn btn-primary mt-4">
                            Calcola Tema Natale
                        </button>

                    </form>
                </div>

            </section>

        </div>

    </div>

</body>

</html>
