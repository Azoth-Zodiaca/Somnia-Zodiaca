<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout">
<head>
    <title>Oracolo - Somnia Zodiaca</title>
</head>
<body>
<section>
    <h1>Oracolo</h1>
    <div th:if="${oracoloError}">
        <p class="error" th:text="${oracoloError}"></p>
    </div>
    <div th:if="${utente == null}">
        <p>Devi essere autenticato per inviare un sogno. <a th:href="@{/login}">Accedi</a> o <a th:href="@{/registrazione}">registrati</a>.</p>
    </div>
    <div th:if="${utente != null}">
        <form th:action="@{/oracolo}" method="post">
            <div>
                <label for="testo">Racconta il tuo sogno</label>
                <textarea id="testo" name="testo" rows="6" required></textarea>
            </div>
            <button type="submit">Consulta l'oracolo</button>
        </form>
    </div>
</section>
</body>
</html>
