<!--
  FRAMMENTO: navbar dell'area pubblica del sito.
  Si include in ogni pagina pubblica così:
  <div th:replace="~{fragments/public-nav :: navbar}"></div>
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="navbar" class="container public-navbar">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      Somnia Zodiaca
    </a>
    <nav>
      <a href="/">Home</a>
      <a href="/enciclopedia">Enciclopedia</a>
      <a href="/premium">Premium</a>
    </nav>
    <div class="nav-actions" th:if="${#strings.isEmpty(username)}">
      <a href="/login" class="btn btn-outline btn-sm">Accedi</a>
      <a href="/register" class="btn btn-primary btn-sm">Iscriviti</a>
    </div>
    <a th:unless="${#strings.isEmpty(username)}" href="/app/dashboard" class="public-profile-link"
      aria-label="Apri la dashboard" title="Apri la dashboard">
      <span class="public-profile-avatar avatar" th:classappend="${' ' + profiloColoreClasse}">
        <img th:if="${avatarPath != null and !#strings.isEmpty(avatarPath)}" th:src="@{${avatarPath}}"
          alt="Immagine profilo">
        <span th:unless="${avatarPath != null and !#strings.isEmpty(avatarPath)}"
          th:text="${username != null and !username.isEmpty() ? #strings.toUpperCase(#strings.substring(username, 0, 1)) : '?'}">U</span>
      </span>
    </a>
  </header>
</body>
</html>
