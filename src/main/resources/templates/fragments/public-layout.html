<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title, description, styleSheetPath)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Quicksilver</title>
    <meta name="description" th:content="${description}" />
    <meta property="og:title" th:content="${title}" />
    <meta property="og:description" th:content="${description}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" th:href="@{/css/fonts.css}" />
    <link rel="stylesheet" th:href="${styleSheetPath}" />
</head>

<body>

    <header class="site-header" th:fragment="header">
        <div class="container flex items-center justify-between site-header-inner">
            <a th:href="@{/}" class="flex items-center gap-2">
                <div class="brand-mark">◈</div>
                <span class="font-display brand-word">Quicksilver</span>
            </a>
            <nav class="flex items-center gap-6 txt-sm text-muted lg-only">
                <a href="#come-funziona" class="h-hover">Come funziona</a>
                <a href="#feed" class="h-hover">Community</a>
                <a th:href="@{/premium}" class="h-hover">Premium</a>
            </nav>

            <!-- utente non autenticato -->
            <div class="flex items-center gap-2" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-sm">Accedi</a>
                <a th:href="@{/registrazione}" class="btn btn-primary btn-sm">Inizia gratis</a>
            </div>
            <!-- utente autenticato -->
            <div class="flex items-center gap-2" sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard}" class="btn btn-primary btn-sm">Vai alla dashboard</a>
            </div>
        </div>
    </header>

    <footer class="border-t mt-16" th:fragment="footer">
        <div class="container py-12 footer-grid">
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="brand-mark">◈</div><span class="font-display txt-xl">Quicksilver</span>
                </div>
                <p class="txt-sm text-muted">L'oracolo alchemico dei tuoi sogni.</p>
            </div>
            <div>
                <div class="txt-xs uppercase tracking-widest text-muted mb-3">Prodotto</div>
                <ul class="grid gap-2 txt-sm">
                    <li><a href="#come-funziona" class="h-hover">Come funziona</a></li>
                    <li><a th:href="@{/premium}" class="h-hover">Premium</a></li>
                </ul>
            </div>
            <div>
                <div class="txt-xs uppercase tracking-widest text-muted mb-3">Community</div>
                <ul class="grid gap-2 txt-sm">
                    <li><a href="#feed" class="h-hover">Feed</a></li>
                </ul>
            </div>
            <div>
                <div class="txt-xs uppercase tracking-widest text-muted mb-3">Legale</div>
                <ul class="grid gap-2 txt-sm">
                    <li><a th:href="@{/privacy}" class="h-hover">Privacy</a></li>
                    <li><a th:href="@{/termini}" class="h-hover">Termini</a></li>
                </ul>
            </div>
        </div>
        <div class="container py-4 border-t txt-xs text-muted flex items-center justify-between">
            <span th:text="'© ' + ${#temporals.year(#temporals.createNow())} + ' Quicksilver'">© 2026 Quicksilver</span>
            <span class="italic">"Il sogno svanisce a mezzogiorno."</span>
        </div>
    </footer>

</body>

</html>
