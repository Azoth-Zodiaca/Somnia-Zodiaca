<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(title='Errore - Somnia Zodiaca', responsive=true)}"></head>

<body>
  <!-- Messaggio di errore e azioni di rientro nel servizio. -->
  <main class="error-page">
    <div class="error-panel">
      <a href="/" class="brand">
        <img class="brand-logo" th:src="@{/images/somnia-zodiaca-logo.svg}" src="/images/somnia-zodiaca-logo.svg" alt="">
        Somnia Zodiaca
      </a>

      <span class="error-code" th:text="${status != null ? status : 500}">500</span>
      <h1 class="serif">Qualcosa non ha funzionato</h1>
      <p class="text-muted" th:text="${message != null and !#strings.isEmpty(message) ? message : 'Si è verificato un errore imprevisto. Riprova tra poco.'}">
        Si è verificato un errore imprevisto. Riprova tra poco.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary">Torna alla home</a>
      </div>
    </div>
  </main>
</body>

</html>
