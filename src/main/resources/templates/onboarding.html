<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crea il tuo tema natale - Somnia Zodiaca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
</head>
<body>

  <div class="onboarding-page">
    <a href="/" class="brand" style="margin-bottom:30px;display:inline-flex;"><span class="brand-dot"></span> Somnia Zodiaca</a>

    <!-- Indicatore dei 3 passaggi. Il passo attivo/completato riceve
         classe "active"/"done": qui sono statici, in produzione andrebbero
         calcolati in base a un parametro "step" passato dal controller. -->
    <div class="onboarding-steps">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>

    <!-- STEP 2 mostrato come esempio: data di nascita + conferma segno.
         In un vero flusso multi-step, ogni passo sarebbe una pagina/form
         separata (o sezioni mostrate/nascoste via JS), con i dati del passo
         precedente salvati in sessione lato server. -->
    <div class="card">
      <h2 class="serif" style="font-weight:500;margin-bottom:6px;">Quando sei nato/a?</h2>
      <p class="text-muted" style="margin-bottom:24px;">Ci serve per calcolare con precisione il tuo tema natale.</p>

      <form th:action="@{/onboarding/dati-nascita}" method="post" action="#">
        <div class="field">
          <label for="data-nascita">Data di nascita</label>
          <input type="date" id="data-nascita" name="dataNascita" required>
        </div>
        <div class="field">
          <label for="ora-nascita">Ora di nascita (se la conosci)</label>
          <input type="time" id="ora-nascita" name="oraNascita">
          <span class="field-hint">Migliora la precisione dell'ascendente e delle case</span>
        </div>
        <div class="field">
          <label for="luogo-nascita">Luogo di nascita</label>
          <input type="text" id="luogo-nascita" name="luogoNascita" placeholder="Napoli, IT" required>
        </div>

        <!-- Segno zodiacale calcolato automaticamente lato server dalla data
             di nascita: qui mostrato come testo segnaposto -->
        <div class="card" style="background:var(--bg-input);border:none;margin-top:10px;">
          <span class="text-muted" style="font-size:12px;">SEGNO SOLARE RILEVATO</span>
          <div style="font-size:18px;font-weight:600;margin-top:4px;">&#9804; Leone</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-20">Calcola il mio tema natale</button>
      </form>
    </div>
  </div>

  <!-- STEP 3: schermata di caricamento con animazione, mostrata dopo
       l'invio del form. In produzione sarebbe una pagina a parte
       (es. /onboarding/calcolo) raggiunta dopo il redirect del form. -->
  <div class="onboarding-page onboarding-loading" style="display:none;" id="loading-step">
    <div class="spinner"></div>
    <h3 class="serif" style="font-weight:500;">Stiamo leggendo il tuo cielo...</h3>
    <p class="text-muted mt-10">Posizioniamo pianeti, case e aspetti astrali.</p>
  </div>

  <script th:src="@{/js/main.js}" src="../static/js/main.js"></script>
</body>
</html>
