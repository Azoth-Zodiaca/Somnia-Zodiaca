<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(title='Wallet - Somnia Zodiaca', responsive=true)}"></head>

<body>
  <div class="app-layout">
    <div th:replace="~{fragments/app-shell :: sidebar(active='wallet')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/app-shell :: topbar(pageTitle='Wallet QI')}"></div>

      <main class="app-content">
        <h2 class="serif wallet-title">Wallet QI</h2>

        <!-- Saldo QI disponibile. -->
        <div class="card wallet-balance">
          <div class="label">Saldo attuale</div>
          <div class="amount">
            &#10022; <span th:text="${utente.qi}">0</span>
          </div>
          <div class="sub">QI &middot; Quicksilver Ingots</div>
        </div>

        <!-- Pacchetti per acquistare QI. -->
        <div class="recharge-grid">
          <div class="card recharge-card">
            <div class="text-muted wallet-package-label">STELLA</div>
            <div class="amount">&#10022; 100</div>
            <div class="bonus">+0 bonus</div>
            <form th:action="@{/app/wallet/ricarica}" method="post">
              <input type="hidden" name="quantitaQi" value="100">
              <button type="submit" class="btn btn-primary btn-block">
                &euro; 0,99
              </button>
            </form>
          </div>
          <div class="card recharge-card">
            <div class="text-muted wallet-package-label">NEBULOSA</div>
            <div class="amount">&#10022; 500</div>
            <div class="bonus">+100 bonus</div>
            <form th:action="@{/app/wallet/ricarica}" method="post">
              <input type="hidden" name="quantitaQi" value="500">
              <button type="submit" class="btn btn-primary btn-block">
                &euro; 3,99
              </button>
            </form>
          </div>
          <div class="card recharge-card">
            <div class="text-muted wallet-package-label">COSTELLAZIONE</div>
            <div class="amount">&#10022; 2.000</div>
            <div class="bonus">+500 bonus</div>
            <form th:action="@{/app/wallet/ricarica}" method="post">
              <input type="hidden" name="quantitaQi" value="2000">
              <button type="submit" class="btn btn-primary btn-block">
                &euro; 14,99
              </button>
            </form>
          </div>
          <div class="card recharge-card">
            <span class="best-value">Miglior valore</span>
            <div class="text-muted wallet-package-label">GALASSIA</div>
            <div class="amount">&#10022; 8.000</div>
            <div class="bonus">+2000 bonus</div>
            <form th:action="@{/app/wallet/ricarica}" method="post">
              <input type="hidden" name="quantitaQi" value="8000">
              <button type="submit" class="btn btn-gold btn-block">
                &euro; 59,99
              </button>
            </form>
          </div>
        </div>

        <!-- Progressione delle ricompense giornaliere e riscatto odierno. -->
        <div class="card">
          <div class="card-title">
            <span>Ricompensa giornaliera</span>
            <span class="text-muted" th:text="${'Giorno ' + giorniRicompense + ' di 7'}">
              Giorno 0 di 7
            </span>
          </div>
          <div class="daily-rewards">
            <div class="daily-reward" th:classappend="${giorniRicompense >= 1 ? 'claimed' : (giornoRicompensa == 1 ? 'available' : 'locked')}">
              +10 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 2 ? 'claimed' : (giornoRicompensa == 2 ? 'available' : 'locked')}">
              +20 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 3 ? 'claimed' : (giornoRicompensa == 3 ? 'available' : 'locked')}">
              +40 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 4 ? 'claimed' : (giornoRicompensa == 4 ? 'available' : 'locked')}">
              +70 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 5 ? 'claimed' : (giornoRicompensa == 5 ? 'available' : 'locked')}">
              +110 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 6 ? 'claimed' : (giornoRicompensa == 6 ? 'available' : 'locked')}">
              +150 QI
            </div>
            <div class="daily-reward" th:classappend="${giorniRicompense >= 7 ? 'claimed' : (giornoRicompensa == 7 ? 'available' : 'locked')}">
              +200 QI
            </div>
          </div>
          <form th:if="${!ricompensaRiscossa}" th:action="@{/app/wallet/ricompensa}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-gold btn-block">
              Riscuoti oggi
            </button>
          </form>
          <div th:if="${ricompensaRiscossa}" class="text-muted text-center">
            Ricompensa già riscossa oggi
          </div>
        </div>
        
      </main>
    </div>
  </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>

</html>
