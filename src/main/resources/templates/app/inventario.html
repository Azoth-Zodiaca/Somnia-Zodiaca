<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Inventario - Quicksilver</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
  <div class="app-layout">
    <div th:replace="~{fragments/app-shell :: sidebar(active='inventario')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/app-shell :: topbar(pageTitle='Inventario')}"></div>

      <main class="app-content">
        <h2 class="serif" style="font-weight:500;margin-bottom:20px;">Inventario</h2>

        <div class="inventory-grid">

          <!-- Colonna sinistra: avatar e slot equipaggiati -->
          <div class="card text-center">
            <span class="text-muted" style="font-size:11px;text-transform:uppercase;">Il tuo avatar</span>
            <div class="avatar" style="width:90px;height:90px;font-size:32px;margin:16px auto;">L</div>

            <div style="text-align:left;">
              <div class="equip-slot">
                <div><span class="slot-label">Sfondo</span><br>Vuoto</div>
              </div>
              <div class="equip-slot">
                <div><span class="slot-label">Cornice</span><br>Vuoto</div>
              </div>
              <div class="equip-slot">
                <div><span class="slot-label">Aura</span><br>Vuoto</div>
              </div>
              <div class="equip-slot">
                <div><span class="slot-label">Copricapo</span><br>Vuoto</div>
              </div>
              <div class="equip-slot">
                <div><span class="slot-label">Titolo</span><br>Vuoto</div>
              </div>
            </div>
          </div>

          <!-- Colonna destra: cosmetici posseduti -->
          <div>
            <div class="flex-between mt-10" style="margin-bottom:16px;">
              <h3 style="font-weight:600;font-size:15px;">Tuoi cosmetici &middot; 2</h3>
              <span class="text-muted" style="font-size:12px;">Ordina per: recente</span>
            </div>

            <div class="progress-bar mt-10" style="margin-bottom:6px;"><div class="progress-bar-fill" style="width:25%;"></div></div>
            <span class="text-muted" style="font-size:12px;">Collezione: 2 di 8</span>

            <!-- Griglia oggetti posseduti. In Spring:
                 th:each="oggetto : ${inventario}" -->
            <div class="owned-grid mt-20">
              <div class="card shop-item">
                <div class="icon-box">&#128167;</div>
                <div class="item-name">Sfondo Nebulosa</div>
                <div class="item-category">Sfondi</div>
                <button class="btn btn-primary btn-sm btn-block js-equip-btn" data-equipped="true">Equipaggiato &#10003;</button>
              </div>

              <div class="card shop-item">
                <div class="icon-box">&#127775;</div>
                <div class="item-name">Cornice d'Oro</div>
                <div class="item-category">Cornici</div>
                <button class="btn btn-ghost btn-sm btn-block js-equip-btn" data-equipped="false">Equipaggia</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>
</html>
