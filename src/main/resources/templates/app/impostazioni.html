<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Impostazioni - Somnia Zodiaca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>

<body>
  <div class="app-layout">
    <div th:replace="~{fragments/app-shell :: sidebar(active='impostazioni')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/app-shell :: topbar(pageTitle='Impostazioni')}"></div>

      <main class="app-content">
        <h2 class="serif settings-title">Impostazioni</h2>

        <div class="settings-layout">

          <!-- Menu laterale interno: mostra/nasconde le sezioni a destra
               tramite main.js -> initSettingsMenu() -->
          <nav class="settings-menu">
            <a href="#" class="active" data-target="sezione-account">Account</a>
            <a href="#" data-target="sezione-sicurezza">Sicurezza</a>
            <a href="#" data-target="sezione-premium">Premium</a>
            <a href="#" data-target="sezione-danger">Zona pericolo</a>
          </nav>

          <div>
            <!-- Sezione Account -->
            <div id="sezione-account" class="card settings-section">
              <h3>Account</h3>
              <form th:action="@{/app/impostazioni/account}" method="post" action="#">
                <div class="field">
                  <label for="username">Username</label>
                  <input type="text" id="username" name="username" th:value="${username}">
                </div>
                <div class="field">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" th:value="${email}">
                </div>
                <button type="submit" class="btn btn-primary">Salva</button>
              </form>
            </div>

            <div id="sezione-sicurezza" class="card settings-section is-hidden">
              <h3>Sicurezza</h3>

              <form th:action="@{/app/impostazioni/password}" method="post">
                <div class="field">
                  <label for="password-attuale">Password attuale</label>
                  <input type="password" id="password-attuale" name="passwordAttuale" required>
                </div>

                <div class="field">
                  <label for="nuova-password">Nuova password</label>
                  <input type="password" id="nuova-password" name="nuovaPassword" minlength="8" required>
                </div>

                <div class="field">
                  <label for="conferma-password">Conferma nuova password</label>
                  <input type="password" id="conferma-password" name="confermaPassword" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary">
                  Cambia password
                </button>
              </form>
            </div>

            <!-- Sezione Premium: stato abbonamento -->
            <div id="sezione-premium" class="card settings-section premium-section is-hidden">
              <h3>Premium</h3>
              <p class="text-muted">Sei attualmente su Premium &middot; rinnovo il 12 agosto 2026.</p>
              <a href="/premium" class="btn btn-outline">Gestisci abbonamento</a>
            </div>

            <!-- Zona pericolo -->
            <div id="sezione-danger" class="card settings-section danger-zone is-hidden">
              <h3>Zona pericolo</h3>
              <p>Eliminando l'account rimuoverai permanentemente sogni, post, inventario e QI.</p>
              <form th:action="@{/app/impostazioni/account/elimina}" method="post">
                <button type="submit" class="btn btn-danger-outline">
                  Elimina account
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>

</html>
