<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Accesso', @{/css/login-style.css})}"></head>

<body>

  <section class="auth-layout">

    <div class="auth-panel">

      <div class="auth-box">

        <p class="label-caps text-accent">Accedi</p>
        <h1 class="auth-title">Il tuo cielo ti attende</h1>

        <p class="alert error" th:if="${param.error}">
          Username o password non validi.
        </p>
        <p class="alert success" th:if="${param.logout}">
          Disconnessione completata correttamente.
        </p>

        <form class="auth-form" th:action="@{/login}" method="post">

          <label class="label-caps text-muted" for="username">Email o username</label>
          <input class="form-input" id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="luna@quicksilver.app">

          <label class="label-caps text-muted" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">

          <button class="btn btn-primary btn-large space-top-sm" type="submit" >Entra nel cielo →</button>

        </form>

        <p class="auth-footer text-center text-sm text-muted">Non hai un account? <a href="registrazione.html"
            class="text-accent font-medium">Crea il tuo</a></p>

      </div>

    </div>

  </section>
</body>

</html>
