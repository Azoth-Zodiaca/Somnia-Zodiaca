<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Accedi - Somnia Zodiaca', responsive=false)}"></head>
<body>
  <!-- Accesso all'area riservata. -->
  <div class="auth-page login-page">
    <div class="auth-form-panel">
      <a href="/" class="brand"><img class="brand-logo" th:src="@{/images/somnia-zodiaca-logo.svg}" src="/images/somnia-zodiaca-logo.svg" alt=""> Somnia Zodiaca</a>
      <h2>Bentornato</h2>

      <!-- Credenziali di accesso. -->
      <form th:action="@{/login}" method="post" action="#">
        <div class="field">
          <label for="usernameOrEmail">Username o email</label>
          <input type="text" id="usernameOrEmail" name="usernameOrEmail" placeholder="Inserisci username o email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Inserisci password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Accedi</button>
      </form>

      <div class="auth-switch">Non hai un account? <a href="/register" class="login-register-link">Registrati</a></div>
    </div>
  </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>
</html>
