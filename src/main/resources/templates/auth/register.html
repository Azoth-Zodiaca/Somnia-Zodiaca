<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrati - Quicksilver</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
  <div class="auth-page">

    <!-- Lato sinistro: frase evocativa, decorativo -->
    <div class="auth-side">
      <a href="/" class="brand"><span class="brand-dot"></span> Quicksilver</a>
      <div class="quote">
        Traccia<br>il tuo <span class="italic">primo cielo</span>.
        <p class="quote-sub">+250 QI di benvenuto, tema natale personalizzato, oracolo AI illimitato per i primi 7 giorni.</p>
      </div>
      <span class="text-muted" style="font-size:12px;">&copy; 2026 Quicksilver</span>
    </div>

    <!-- Lato destro: form di registrazione.
         In Spring: th:action="@{/register}" method="post" e th:object="${nuovoUtente}" -->
    <div class="auth-form-panel">
      <h2>Crea il tuo account</h2>

      <form th:action="@{/register}" method="post" action="#">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="lunadark" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tua@email.it" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Almeno 8 caratteri" required minlength="8">
          <span class="field-hint">Molto debole &rarr; usa lettere, numeri e simboli</span>
        </div>
        <div class="field">
          <label for="lingua">Lingua</label>
          <select id="lingua" name="lingua">
            <option value="it" selected>Italiano</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="field field-checkbox">
          <input type="checkbox" id="accetta" name="accettaTermini" required>
          <label for="accetta" style="margin:0;text-transform:none;">Accetto i <a href="/legal/termini">Termini</a> e la <a href="/legal/privacy">Privacy</a></label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Registrati</button>
      </form>

      <div class="divider">oppure</div>
      <div class="social-login">
        <button class="btn btn-ghost">Google</button>
        <button class="btn btn-ghost">Apple</button>
      </div>

      <div class="auth-switch">Hai già un account? <a href="/login" style="color:var(--accent-purple);font-weight:600;">Accedi</a></div>
    </div>
  </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>
</html>
