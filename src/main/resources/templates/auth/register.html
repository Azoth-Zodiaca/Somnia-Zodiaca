<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrati - Somnia Zodiaca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>

<body>
  <div class="auth-page">

    <!-- Lato sinistro: frase evocativa, decorativo -->
    <div class="auth-side">
      <a href="/" class="brand"><span class="brand-dot"></span> Somnia Zodiaca</a>
      <div class="quote">
        Traccia<br>il tuo <span class="italic">primo cielo</span>.
        <p class="quote-sub">+250 QI di benvenuto, tema natale personalizzato, oracolo AI illimitato per i primi 7
          giorni.</p>
      </div>
      <span class="text-muted register-copyright">&copy; 2026 Somnia Zodiaca</span>
    </div>

    <!-- Lato destro: form di registrazione.
         In Spring: th:action="@{/register}" method="post" e th:object="${nuovoUtente}" -->
    <div class="auth-form-panel">
      <h2>Crea il tuo account</h2>

      <form th:action="@{/register}" method="post" id="register-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="lunadark" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tua@email.it" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Almeno 8 caratteri" required minlength="8"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
            title="La password deve contenere almeno 8 caratteri, una maiuscola, una minuscola, un numero e un simbolo">
          <span class="field-hint">
            <span id="password-strength" class="field-hint">
              Inserisci una password
            </span>
            &rarr; usa lettere, numeri e simboli</span>
        </div>
        <div class="field field-checkbox">
          <input type="checkbox" id="accetta" name="accettaTermini" required>
          <label for="accetta">
            Accetto i <a href="/legal/termini">Termini</a> e la
            <a href="/legal/privacy">Privacy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Registrati</button>
      </form>

      <div class="auth-switch">
        Hai già un account?
        <a href="/login" class="register-login-link">Accedi</a>
      </div>

  <script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>

</html>
